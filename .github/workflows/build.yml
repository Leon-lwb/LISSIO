name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 0.1.3 或 0.1.3-beta.1)；留空则取上个 tag 的 patch+1 自动提升'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26
  RUST_TOOLCHAIN: stable

jobs:
  set-version:
    name: Set version and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      main_sha: ${{ steps.bump.outputs.main_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # set-version.mjs 内部用 cargo metadata 刷新 Cargo.lock
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve + bump version, commit to main & develop
        id: bump
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "使用手动指定版本: $VERSION"
          else
            LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$LAST_TAG" ]; then
              echo "::warning::仓库无任何 v* tag,回退到 0.1.0"
              VERSION="0.1.0"
            else
              BASE="${LAST_TAG#v}"
              BASE="${BASE%%-*}"
              IFS='.' read -r MAJ MIN PATCH <<< "$BASE"
              VERSION="$MAJ.$MIN.$((PATCH+1))"
            fi
            echo "自动提升: ${LAST_TAG:-<none>} -> $VERSION"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop

          # 两个分支分别独立执行 set-version 再提交,避免分叉时 cherry-pick 冲突
          for BR in main develop; do
            git checkout -B "$BR" "origin/$BR"
            pnpm set-version "$VERSION"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            if git diff --cached --quiet; then
              echo "$BR 已是 v$VERSION,无需提交"
            else
              git commit -m "chore: bump version to v$VERSION [skip ci]"
              git push origin "$BR"
            fi
          done

          git checkout main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gates
    needs: set-version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-version.outputs.main_sha }}
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Install system and frontend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libudev-dev pkg-config
          pnpm install --frozen-lockfile
      - name: Frontend and architecture gates
        run: |
          pnpm architecture >/dev/null
          pnpm check:architecture
          pnpm check:deps
          pnpm check:web-contract
          pnpm typecheck
          pnpm lint:ci
          pnpm test
          pnpm build:web
      - name: Browser E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Rust gates
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets
          cargo test --workspace
          cargo deny check

  build:
    name: Build ${{ matrix.platform }} (v${{ needs.set-version.outputs.version }})
    needs: [set-version, quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            artifact-name: macos-arm64
            rust-targets: aarch64-apple-darwin
            updater-arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            artifact-name: macos-amd64
            rust-targets: x86_64-apple-darwin
            updater-arch: x64
          - platform: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            args: ''
            artifact-name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            artifact-name: windows

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-version.outputs.main_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Select fastest apt mirror
        if: matrix.platform == 'ubuntu-26.04'
        shell: bash
        run: |
          MIRRORS=(
            "http://azure.archive.ubuntu.com/ubuntu"
            "http://archive.ubuntu.com/ubuntu"
            "http://security.ubuntu.com/ubuntu"
            "https://mirrors.tuna.tsinghua.edu.cn/ubuntu"
            "https://mirrors.aliyun.com/ubuntu"
            "https://mirrors.ustc.edu.cn/ubuntu"
            "https://mirrors.cloud.tencent.com/ubuntu"
          )
          BEST=""
          BEST_TIME=999999
          for m in "${MIRRORS[@]}"; do
            t=$(curl -o /dev/null -s -w '%{time_total}' --connect-timeout 3 --max-time 10 "$m/dists/resolute/Release" || echo 999999)
            echo "$m -> ${t}s"
            if awk "BEGIN{exit !($t < $BEST_TIME)}"; then
              BEST_TIME=$t
              BEST=$m
            fi
          done
          if [ -z "$BEST" ]; then
            echo "::warning::所有镜像测速失败，保留默认源"
            exit 0
          fi
          echo "Fastest mirror: $BEST (${BEST_TIME}s)"
          # Ubuntu 24.04+ 使用 deb822 格式 (/etc/apt/sources.list.d/ubuntu.sources)
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo sed -i \
              -e "s|http://azure.archive.ubuntu.com/ubuntu|$BEST|g" \
              -e "s|http://archive.ubuntu.com/ubuntu|$BEST|g" \
              -e "s|http://security.ubuntu.com/ubuntu|$BEST|g" \
              "$f"
          done

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config
          # linuxdeploy 本身是 AppImage, 24.04+ 默认不带 libfuse2 (包名 libfuse2t64)
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target sidecar
        run: pnpm prepare:sidecar:release -- --target=${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 无 FUSE 环境下解包运行 linuxdeploy/appimagetool, 避免 AppImage 打包卡死
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: ${{ matrix.args }}

      - name: Build independent Backend/CLI package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path src-tauri/Cargo.toml --release --target "${{ matrix.target }}" -p backend-server -p backend-cli
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          OUT="release/lissio-backend-${{ needs.set-version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "src-tauri/target/${{ matrix.target }}/release/lissio-server${EXT}" "$OUT/"
          cp "src-tauri/target/${{ matrix.target }}/release/backend-cli${EXT}" "$OUT/"
          cp packaging/server/README.md packaging/server/start.sh packaging/server/start.ps1 "$OUT/"
          chmod +x "$OUT/start.sh" || true
          tar -czf "${OUT}.tar.gz" -C release "$(basename "$OUT")"

      - name: Build versioned Web package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pnpm build:web
          tar -czf "release/lissio-web-${{ needs.set-version.outputs.version }}.tar.gz" -C dist .

      - name: Rename macOS updater artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # tauri 生成的 .app.tar.gz 不含架构名, 两个 macOS target 产物同名 —
          # 上传 Release 时会冲突 (HTTP 422 name already exists), 补上架构后缀
          find src-tauri/target -type f -name "*.app.tar.gz*" -path "*/bundle/*" | while read -r f; do
            case "$f" in
              *.app.tar.gz)     mv -v "$f" "${f%.app.tar.gz}_${{ matrix.updater-arch }}.app.tar.gz" ;;
              *.app.tar.gz.sig) mv -v "$f" "${f%.app.tar.gz.sig}_${{ matrix.updater-arch }}.app.tar.gz.sig" ;;
            esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.artifact-name }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.nsis.zip
            src-tauri/target/**/bundle/**/*.sig
            release/*.tar.gz
          retention-days: 30
          if-no-files-found: error
