name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 0.1.2-beta.1)，需与构建时填写的版本一致'
        required: true
        type: string
      build_run_id:
        description: 'Build workflow run ID (留空则自动使用当前提交对应的成功构建)'
        required: false
        type: string
      prerelease:
        description: '标记为 pre-release'
        required: true
        type: boolean
        default: true
      draft:
        description: '保存为 draft (不公开发布)'
        required: true
        type: boolean
        default: false

jobs:
  release:
    name: Create Release
    permissions:
      contents: write
      actions: read
      packages: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build run ID
        id: resolve-run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.build_run_id }}" ]; then
            RUN_ID="${{ inputs.build_run_id }}"
            echo "使用手动指定的 Build run ID: $RUN_ID"
          else
            echo "未指定 build_run_id，查找当前提交对应的最近一次成功构建..."
            RUN_ID=$(gh run list \
              --workflow=build.yml \
              --commit "${{ github.sha }}" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -z "$RUN_ID" ]; then
              echo "::error::未找到成功的 Build workflow run。请先手动触发 Build 工作流，或手动指定 build_run_id。"
              exit 1
            fi
            echo "自动找到当前提交的 Build run ID: $RUN_ID"
          fi
          RUN_JSON=$(gh run view "$RUN_ID" --json workflowName,conclusion,headSha)
          WORKFLOW=$(jq -r '.workflowName' <<< "$RUN_JSON")
          HEAD_SHA=$(jq -r '.headSha' <<< "$RUN_JSON")
          CONCLUSION=$(jq -r '.conclusion' <<< "$RUN_JSON")
          if [ "$WORKFLOW" != "Build" ] || [ "$CONCLUSION" != "success" ]; then
            echo "::error::Build run $RUN_ID 不是成功的 Build 工作流运行。"
            echo "workflow=$WORKFLOW conclusion=$CONCLUSION"
            exit 1
          fi
          if [ "$HEAD_SHA" != "${{ github.sha }}" ]; then
            # Build 工作流的 set-version 步骤可能自动推送 version bump 提交,
            # 此时 build run 的 headSha 是发布提交的祖先而非其本身
            git fetch --depth=100 origin "${{ github.ref }}"
            if git merge-base --is-ancestor "$HEAD_SHA" "${{ github.sha }}"; then
              echo "::warning::Build run 的 headSha ($HEAD_SHA) 与发布提交不同 (存在自动 version bump 提交),已验证其为当前提交的祖先,继续发布。"
            else
              echo "::error::Build run $RUN_ID 不属于当前发布提交。"
              echo "head_sha=$HEAD_SHA expected_sha=${{ github.sha }}"
              exit 1
            fi
          fi
          echo "已验证 Build #$RUN_ID 对应当前提交代码线 (head_sha=$HEAD_SHA)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.resolve-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "=== 下载的构件 ==="
          find artifacts -type f | sort

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          mapfile -t FILES < <(find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.app.tar.gz" -o \
            -name "*.nsis.zip" -o \
            -name "*.sig" -o \
            -name "lissio-backend-*.tar.gz" -o \
            -name "lissio-web-*.tar.gz" \
          \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::未在构件中找到任何安装包文件"
            exit 1
          fi
          echo "找到 ${#FILES[@]} 个发布文件："
          printf '  %s\n' "${FILES[@]}"
          printf '%s\n' "${FILES[@]}" > /tmp/release-assets.txt
          echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PLATFORMS='{}'

          add_platform() {
            local key="$1" file="$2"
            local sig_file="${file}.sig"
            if [ ! -f "$sig_file" ]; then
              echo "::warning::缺少签名文件 $sig_file，跳过平台 $key"
              return 0
            fi
            local sig name
            sig=$(tr -d '\r\n' < "$sig_file")
            name=$(basename "$file")
            PLATFORMS=$(jq --arg k "$key" --arg sig "$sig" --arg url "$BASE/$name" \
              '. + {($k): {signature: $sig, url: $url}}' <<< "$PLATFORMS")
            echo "平台 $key → $name"
          }

          while IFS= read -r f; do
            case "$f" in
              *_aarch64.app.tar.gz)   add_platform darwin-aarch64 "$f" ;;
              *_x64.app.tar.gz)       add_platform darwin-x86_64 "$f" ;;
              *_amd64.AppImage)       add_platform linux-x86_64 "$f" ;;
              *.nsis.zip)             add_platform windows-x86_64 "$f" ;;
            esac
          done < <(find artifacts -type f \( \
            -name "*.app.tar.gz" -o -name "*.AppImage" -o -name "*.nsis.zip" \
          \) | sort)

          if [ "$PLATFORMS" = '{}' ]; then
            echo "::warning::未找到任何带签名的更新包，跳过 latest.json 生成 (应用内检查更新将不可用)。请确认 CI 已配置 TAURI_SIGNING_PRIVATE_KEY。"
            exit 0
          fi

          jq -n \
            --arg version "${{ inputs.version }}" \
            --arg notes "v${{ inputs.version }}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > artifacts/latest.json

          echo "=== latest.json ==="
          cat artifacts/latest.json
          echo "$(pwd)/artifacts/latest.json" >> /tmp/release-assets.txt

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts/SHA256SUMS
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            sha256sum "$file" | sed "s#  .*/#  #" >> artifacts/SHA256SUMS
          done < /tmp/release-assets.txt
          echo "$(pwd)/artifacts/SHA256SUMS" >> /tmp/release-assets.txt
          cat artifacts/SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"

          PRERELEASE_LABEL="${{ inputs.prerelease == true && 'pre-release' || '正式 release' }}"
          cat > /tmp/release-notes.md <<NOTES
          ## v${{ inputs.version }}

          本次为 ${PRERELEASE_LABEL}。

          ### 安装包
          - macOS: \`.dmg\` (Apple Silicon / Intel)
          - Linux: \`.deb\` / \`.AppImage\`
          - Windows: \`.msi\` / \`.exe\` (NSIS)

          > 共包含 ${{ steps.assets.outputs.count }} 个文件，来自 Build #${{ steps.resolve-run.outputs.run_id }}
          NOTES

          ARGS=(--title "$TAG" --notes-file /tmp/release-notes.md --target "${{ github.sha }}")
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            ARGS+=(--draft)
          fi

          mapfile -t FILES < /tmp/release-assets.txt
          gh release create "$TAG" "${FILES[@]}" "${ARGS[@]}"
          echo "✅ Release $TAG 创建成功"

      - name: Update beta channel manifest (rolling tag)
        # 应用 beta 通道从固定 URL 拉取 beta-latest.json (不经 GitHub API, 避免限流 403)。
        # 每次正式发布 (prerelease 或正式版, 非 draft) 都刷新它, 语义等同"所有 release 取最新";
        # stable 通道走 releases/latest/download/latest.json, 无需额外维护。
        if: inputs.draft == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f artifacts/latest.json ]; then
            echo "::warning::无 latest.json (可能缺少签名构件), 跳过 beta 通道 manifest 更新"
            exit 0
          fi
          cp artifacts/latest.json beta-latest.json
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease \
              --title "Beta 更新通道" \
              --notes "此 release 仅用于托管 beta 通道的更新清单 (beta-latest.json), 由 CI 自动维护, 请勿删除或标记为 latest。" \
              --target "${{ github.sha }}"
          fi
          gh release upload beta beta-latest.json --clobber
          echo "✅ beta 通道 manifest 已更新到 v${{ inputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish server + web OCI image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:${{ inputs.version }}" \
            --tag "$IMAGE:latest" \
            --push .
