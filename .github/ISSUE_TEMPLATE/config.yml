# Entry points beyond the repository's issue templates.
# blank_issues_enabled allows asking without a template, for quick feedback.
# contact_links routes issues unsuitable for public tracking to more appropriate channels, keeping
# exploit details or report contents out of public issues.
# Link hostnames come from the git remote (docs and the About dialog use the same source); changing
# the hosting location requires updating this file too.

blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability or intellectual property issue
    url: https://codeberg.org/Horldsence/Lissio/src/branch/main/SECURITY.md
    about: Do not disclose exploitable vulnerability details in a public issue; see SECURITY.md for channels and response times.
  - name: Contributing guide
    url: https://codeberg.org/Horldsence/Lissio/src/branch/main/CONTRIBUTING.md
    about: Read the merge gates and license terms before opening a PR.