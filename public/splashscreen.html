<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lissio</title>
    <style>
      :root {
        color-scheme: dark;
        --phase-blue: #315cff;
        --signal-cyan: #45e6c3;
        --signal-lime: #c8ff4d;
      }
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        background: transparent;
      }
      body {
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }
      .card {
        display: grid;
        grid-template-columns: 118px 1fr;
        align-items: center;
        gap: 28px;
        width: 100%;
        height: 100%;
        padding: 0 42px;
        overflow: hidden;
        border-radius: 24px;
        background:
          radial-gradient(circle at 15% 25%, rgba(49, 92, 255, 0.18), transparent 42%),
          linear-gradient(145deg, #111622 0%, #080a10 72%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.075);
        color: #f7f9ff;
      }
      .mark {
        width: 118px;
        height: 118px;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(49, 92, 255, 0.32));
      }
      .track {
        fill: none;
        stroke: url(#brand-gradient);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.16;
      }
      .info { display: grid; gap: 7px; min-width: 0; }
      .name { font-size: 32px; font-weight: 700; letter-spacing: -0.025em; }
      .status { margin-top: 4px; font-size: 11px; color: rgba(247, 249, 255, 0.46); }
      .status::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75%, 100% { content: '...'; }
      }
      @media (prefers-reduced-motion: reduce) {
        .status::after { animation: none; content: '...'; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="brand-gradient" x1="18" y1="18" x2="82" y2="82" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#315cff" />
            <stop offset="0.58" stop-color="#45e6c3" />
            <stop offset="1" stop-color="#c8ff4d" />
          </linearGradient>
        </defs>
        <path class="track" data-lissio-path />
        <g id="particles"></g>
      </svg>
      <section class="info">
        <div class="name">Lissio</div>
        <div class="status">正在准备工作台</div>
      </section>
    </main>
    <script>
      // Lissajous Drift
      // A = 24 + 6s
      // x(t) = 50 + sin(3t + 1.57) · A
      // y(t) = 50 + sin(4t) · 0.92A
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const TAU = Math.PI * 2;
      const PARTICLE_COUNT = 68;
      const TRAIL_SPAN = 0.34;
      const DURATION_MS = 6000;
      const PULSE_MS = 5400;
      const path = document.querySelector('[data-lissio-path]');
      const particleLayer = document.querySelector('#particles');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 品牌渐变三色: 头部荧光绿 → 中段信号青 → 尾部品牌蓝
      const COLOR_STOPS = [
        { at: 0, rgb: [200, 255, 77] },
        { at: 0.5, rgb: [69, 230, 195] },
        { at: 1, rgb: [49, 92, 255] },
      ];
      function particleColor(offset) {
        const [a, b] = offset <= 0.5 ? [COLOR_STOPS[0], COLOR_STOPS[1]] : [COLOR_STOPS[1], COLOR_STOPS[2]];
        const t = (offset - a.at) / (b.at - a.at);
        const rgb = a.rgb.map((channel, i) => Math.round(channel + (b.rgb[i] - channel) * t));
        return `rgb(${rgb.join(',')})`;
      }

      const particles = Array.from({ length: PARTICLE_COUNT }, (_, index) => {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('fill', particleColor(index / (PARTICLE_COUNT - 1)));
        particleLayer.appendChild(circle);
        return circle;
      });

      function point(progress, detailScale) {
        const t = progress * TAU;
        const amp = 24 + detailScale * 6;
        return {
          x: 50 + Math.sin(3 * t + 1.57) * amp,
          y: 50 + Math.sin(4 * t) * amp * 0.92,
        };
      }
      function normalize(progress) { return ((progress % 1) + 1) % 1; }
      function buildPath(detailScale, steps = 360) {
        const points = [];
        for (let index = 0; index <= steps; index += 1) {
          const p = point(index / steps, detailScale);
          points.push(`${index === 0 ? 'M' : 'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`);
        }
        return points.join(' ');
      }
      function frame(progress, detailScale) {
        path.setAttribute('d', buildPath(detailScale));
        particles.forEach((node, index) => {
          const tailOffset = index / (PARTICLE_COUNT - 1);
          const p = point(normalize(progress - tailOffset * TRAIL_SPAN), detailScale);
          const fade = Math.pow(1 - tailOffset, 0.56);
          node.setAttribute('cx', p.x.toFixed(2));
          node.setAttribute('cy', p.y.toFixed(2));
          node.setAttribute('r', (0.9 + fade * 2.7).toFixed(2));
          node.setAttribute('opacity', (0.04 + fade * 0.96).toFixed(3));
        });
      }

      if (reducedMotion) {
        frame(0, 0.76);
      } else {
        const startedAt = performance.now();
        const render = (now) => {
          const time = now - startedAt;
          const pulse = (Math.sin(((time % PULSE_MS) / PULSE_MS) * TAU + 0.55) + 1) / 2;
          frame((time % DURATION_MS) / DURATION_MS, 0.52 + pulse * 0.48);
          requestAnimationFrame(render);
        };
        requestAnimationFrame(render);
      }
    </script>
  </body>
</html>
