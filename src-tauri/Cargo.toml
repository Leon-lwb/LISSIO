[package]
name = "lissio"
version = "0.9.0"
description = "Modern serial data assistant with VOFA-compatible protocol support"
authors = ["Horldsence", "sloray"]
license = "Apache-2.0"
repository = "https://codeberg.org/Horldsence/Lissio"
edition = "2024"

[package.metadata.lissio]
domain = "desktop"
layer = 5
responsibility = "Desktop platform shell, window/update integration, and supervised lissio-server sidecar lifecycle"

[lib]
name = "lissio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Pin the desktop binary to the product name; the implicit target would follow
# the package name if this section were ever removed.
[[bin]]
name = "lissio"
path = "src/main.rs"

[features]
default = []

[profile.release]
debug = false
# Linux embeds DWARF in each executable, including the bundled server sidecar.
# Strip symbols at link time so every release entry point produces small binaries.
strip = "symbols"

# Preserve benchmark symbols; bench-audit.sh opts out of debug info separately.
[profile.bench]
debug = true
strip = "none"

# Keep optimized builds with full symbols available for perf/flamegraph work.
# cargo build --profile profiling -p lissio-backend-server
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[workspace]
# Domain and dependency rules: see docs/architecture/crates.md. Directories group by domain
# and the layer is expressed by [package.metadata.lissio]; depending directly on any lower
# layer is allowed, with no forwarding facade.
members = [
  # Members are grouped by domain for navigation only. The authoritative domain and
  # dependency layer of every crate live in its [package.metadata.lissio]; run
  # `pnpm architecture` for the generated domain x layer matrix, and see
  # docs/architecture/crates.md for the domain DAG and layer rules.
  # shared
  "crates/shared/error",
  "crates/shared/flow",
  "crates/shared/data-model",
  "crates/shared/subscription",
  # vehicle
  "crates/vehicle/can",
  "crates/vehicle/diagnostic",
  # protocol
  "crates/protocol/points",
  "crates/protocol/logic",
  "crates/protocol/schema_types",
  "crates/protocol/protocol",
  "crates/protocol/protocol_float",
  "crates/protocol/protocol_can_bridge",
  "crates/protocol/logic_decoder",
  "crates/protocol/schema",
  "crates/protocol/acquisition",
  "crates/protocol/frame-decoder",
  # signal
  "crates/signal/raw-data",
  "crates/signal/waveform",
  "crates/signal/filter",
  "crates/signal/spectrum",
  "crates/signal/measurement",
  "crates/signal/gpu",
  # graph
  "crates/graph/buffer_graph",
  "crates/graph/kind",
  "crates/graph/hir",
  "crates/graph/plane",
  "crates/graph/lower",
  "crates/graph/eval",
  "crates/graph/graph",
  "crates/graph/trigger",
  "crates/graph/graph-testkit",
  # transport
  "crates/transport/device-tree",
  "crates/transport/serial",
  "crates/transport/network",
  "crates/transport/can-transport",
  "crates/transport/transport",
  "crates/transport/modbus-adapter",
  "crates/transport/s7-adapter",
  "crates/transport/automotive",
  "crates/transport/automotive_isotp",
  "crates/transport/automotive_diag",
  # data
  "crates/data/bus",
  "crates/data/recording",
  # ai
  "crates/ai/llm",
  "crates/ai/chat-session",
  "crates/ai/chat",
  "crates/ai/mcp-client",
  # desktop
  "crates/desktop/events",
  "crates/desktop/pipeline",
  "crates/desktop/stream",
  "crates/desktop/evaluator",
  "crates/desktop/app",
  "crates/desktop/graph_ops",
  "crates/desktop/menu_shell",
  "crates/desktop/update_flow",
  "crates/desktop/ai-host",
  "crates/desktop/control-api",
  "crates/desktop/rpc-api",
  "crates/desktop/performance",
  "crates/desktop/backend-server",
  "crates/desktop/backend-host",
  "crates/desktop/mcp-server",
  "crates/desktop/backend-cli",
]

[workspace.package]
edition = "2024"
repository = "https://codeberg.org/Horldsence/Lissio"
version = "0.9.0"
license = "Apache-2.0"

[workspace.lints.clippy]
# Strictest clippy configuration — every rule group denied
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Reasonably relaxed rules (style preferences or external factors beyond our control)
# Allow module and type names to repeat (e.g. config::Config, transport::Transport)
module_name_repetitions = "allow"
# Do not require must_use on every function (too aggressive)
must_use_candidate = "allow"
# Do not require docs on functions returning Result/Option (this project is not a public-API library)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Do not require backticks around identifiers in docs
doc_markdown = "allow"
# Dependency version conflicts are beyond our control
multiple_crate_versions = "allow"
# Do not require complete package metadata (description/license, etc.)
cargo_common_metadata = "allow"
# Allow many arguments (e.g. config initialization)
too_many_arguments = "allow"
# Allow enum variant names to repeat the outer name
enum_glob_use = "allow"
# Allow std::print (for debugging)
print_stdout = "allow"
print_stderr = "allow"
# Allow large integer/float literals without underscores (e.g. baud rate 115200)
unreadable_literal = "allow"
# Allow match on the same variable
single_match_else = "allow"
# Allow if-then-else chains (when clearer than match)
match_same_arms = "allow"
# Allow manual clamp

manual_clamp = "allow"
# Allow unoptimized struct field order
struct_field_names = "allow"
# Allow longer documentation
doc_link_code = "allow"
# Allow &Vec parameters (compatible with the existing API)
ptr_arg = "allow"
# Allow returning references
needless_pass_by_value = "allow"
# Allow format! strings
useless_format = "allow"
# Allow new() without an explicit Default implementation
new_without_default = "allow"
# Allow many methods (impl blocks)
too_many_lines = "allow"
# Holding a MutexGuard critical section in full, following lock order, is the data plane's
# deliberate concurrency semantics; shrinking the scope per use would instead widen the race
# window (clippy nursery heuristic)
significant_drop_tightening = "allow"
# Tauri commands stay async so they run on the tokio runtime (sync commands run on the main
# thread, where lock-holding paths would block the UI); many commands having no await point is normal
unused_async = "allow"
# Same as above: Tauri commands/AppState methods keep an async signature with no await point as normal
# (newer clippy splits that shape inside impl blocks into a separate lint)
unused_async_trait_impl = "allow"
# The test assertion `assert!(x.is_empty())` is semantically clear and does not require the
# collection to implement PartialEq; rewriting it as assert_eq needs per-type adaptation and is
# infeasible for custom collections
assert_is_empty = "allow"

[workspace.lints.cargo]
# Cargo's own lint namespace (`cargo::*`) is separate from the `clippy::cargo`
# lint group above: denying `clippy::cargo` does NOT deny
# `cargo::unused_dependencies`, which is `warn` by default, so an unused
# dependency could survive `cargo clippy` while the gate claimed cargo lints
# were denied. Deny it here; `cargo clippy --workspace --all-targets` reports
# these at manifest finalization. The `cargo::` lints are a nightly feature,
# which is this workspace's default toolchain channel.
unused_dependencies = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# schemars: single source for the JSON Schema of capability-node tool inputs (same major
# version as the one embedded in rmcp); MCP tool routing and built-in AI tool specs derive
# from the same schema
schemars = "1"
# ts-rs: generates TypeScript declarations from Rust wire types (an explicit export program,
# not test-time automatic file writes). Build-time contract export only; the incompatible
# serde-compat attribute warnings are kept as part of drift detection.
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# genai: multi-LLM-provider aggregation client (26+ native protocols: OpenAI/Anthropic/Gemini/
# DeepSeek/Tongyi/Kimi/GLM/Ollama and more), reusing reqwest+rustls internally with complete
# streaming and tool calling — avoids hand-writing each provider protocol in the AI chat layer
# (AI features are planned uniformly in the backend infrastructure)
genai = "0.6"
# rmcp: the official Model Context Protocol Rust SDK — bidirectional MCP client
# (stdio/streamable-http) and server (streamable-http) capability; the MCP protocol is not
# implemented in this repository
rmcp = { version = "3.1", default-features = false, features = [
  "macros",
  "server",
  "transport-streamable-http-server",
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# axum: HTTP host for the local MCP server (the rmcp streamable-http server transport is a
# tower service and needs an HTTP framework to mount it), listening on 127.0.0.1 only
# keyring: system credential store (macOS Keychain / Windows Credential Manager / libsecret) —
# AI provider API keys live in the keychain rather than plaintext settings.json; home-grown
# encrypted files on disk can still be extracted, so the system credential store is the correct
# approach
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
security-framework = "3"
# axum: HTTP-RPC + WebSocket host for the web exit (backend-server), as well as the MCP server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
# tower-http: CORS allowlist / request body limit / static site hosting for the web exit
tower-http = { version = "0.6", default-features = false, features = ["cors", "limit", "fs", "trace"] }
futures = "0.3"
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs", "signal"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = { version = "5.4.4", default-features = false }
# tokio-s7: Siemens S7comm async client (ISO-on-TCP), the second point source for PLC acquisition (Apache-2.0)
tokio-s7 = "0.1.7"
log = "0.4"
# clap: backend-cli subcommand parsing (derive); env_logger: stderr logging for headless hosts
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
thiserror = "1"
regex = "1"
glob = "0.3"
rustc-hash = "2"
criterion = { version = "0.7", features = ["html_reports"] }
parking_lot = "0.12"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
# wgpu: cross-platform GPU compute (macOS=Metal / Windows=DX12+Vulkan / Linux=Vulkan) —
# waveform envelope downsampling (gpu_core); pollster provides synchronous init/mapping on
# blocking threads
wgpu = "30"
pollster = "1"
# scirs2-core: SciRS2 scientific computing core — SIMD batch evaluation for the numeric
# plane's Math unit (SimdUnifiedOps, wide backend, AVX2/NEON runtime dispatch); std must be
# enabled explicitly (0.6.5 packaging flaw: with default features off, many modules are not
# gated for no_std)
scirs2-core = { version = "0.6.5", default-features = false, features = ["std", "simd"] }
# Tauri desktop framework and official plugins — the single version registration point; members
# always inherit via `workspace = true`; tauri features take the historical union of the root and
# members (features are unioned across the dependency graph, equivalent to the former scattered
# declarations)
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 0.8 is the line tauri 2.12 itself resolves, so the workspace compiles one copy
# instead of also linking 0.6 for the shell's window material.
window-vibrancy = "0.8"
# dirs: 与 tauri 同一条依赖线 (7), 桌面壳用它解析日志目录 —— 与 tauri 的
# `PathResolver::app_log_dir` 用同一个 crate, 预检路径才不会和插件各解析一套。
dirs = "7"
getrandom = "0.3"
# Hardware/platform access
serialport = "4"
core-foundation = "0.10"
io-kit-sys = "0.4"
nusb = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry", "Win32_System_Time"] }
# sysinfo: cross-platform process CPU/memory sampling (performance monitor L4 adapter, system feature only)
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# FFT (dsp_fft)
rustfft = "6"
realfft = "3"
bytemuck = { version = "1", features = ["derive"] }
duckdb = { version = "1.5.5", features = ["bundled", "parquet"] }
# sea-orm: async ORM over sqlx — the recording store's SQLite/PostgreSQL/MySQL
# engines. Drivers are enabled per crate feature so a reduced build can drop one.
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "macros"] }
# ---- workspace-internal crates (path = crates/<domain>/<crate>) ----
# L0 foundation
gpu = { version = "0.9.0", package = "lissio-gpu", path = "crates/signal/gpu" }
waveform = { version = "0.9.0", package = "lissio-waveform", path = "crates/signal/waveform" }
buffer_graph = { version = "0.9.0", package = "lissio-buffer-graph", path = "crates/graph/buffer_graph" }
raw-data = { version = "0.9.0", package = "lissio-raw-data", path = "crates/signal/raw-data" }
data_model = { version = "0.9.0", package = "lissio-data-model", path = "crates/shared/data-model" }
error = { version = "0.9.0", package = "lissio-error", path = "crates/shared/error" }
flow = { version = "0.9.0", package = "lissio-flow", path = "crates/shared/flow" }
points = { version = "0.9.0", package = "lissio-points", path = "crates/protocol/points" }
acquisition = { version = "0.9.0", package = "lissio-acquisition", path = "crates/protocol/acquisition" }
can = { version = "0.9.0", package = "lissio-can", path = "crates/vehicle/can" }
logic = { version = "0.9.0", package = "lissio-logic", path = "crates/protocol/logic" }
diagnostic = { version = "0.9.0", package = "lissio-diagnostic", path = "crates/vehicle/diagnostic" }
schema_types = { version = "0.9.0", package = "lissio-schema-types", path = "crates/protocol/schema_types" }
events = { version = "0.9.0", package = "lissio-events", path = "crates/desktop/events" }
subscription = { version = "0.9.0", package = "lissio-subscription", path = "crates/shared/subscription" }
filter = { version = "0.9.0", package = "lissio-filter", path = "crates/signal/filter" }
spectrum = { version = "0.9.0", package = "lissio-spectrum", path = "crates/signal/spectrum" }
measurement = { version = "0.9.0", package = "lissio-measurement", path = "crates/signal/measurement" }
# L1 protocol
protocol = { version = "0.9.0", package = "lissio-protocol", path = "crates/protocol/protocol" }
protocol_float = { version = "0.9.0", package = "lissio-protocol-float", path = "crates/protocol/protocol_float" }
protocol_can_bridge = { version = "0.9.0", package = "lissio-protocol-can-bridge", path = "crates/protocol/protocol_can_bridge" }
logic_decoder = { version = "0.9.0", package = "lissio-logic-decoder", path = "crates/protocol/logic_decoder" }
schema = { version = "0.9.0", package = "lissio-schema", path = "crates/protocol/schema" }
# L1 transport
device_tree = { version = "0.9.0", package = "lissio-device-tree", path = "crates/transport/device-tree" }
can_transport = { version = "0.9.0", package = "lissio-can-transport", path = "crates/transport/can-transport" }
transport = { version = "0.9.0", package = "lissio-transport", path = "crates/transport/transport" }
network = { version = "0.9.0", package = "lissio-network", path = "crates/transport/network" }
serial = { version = "0.9.0", package = "lissio-serial", path = "crates/transport/serial" }
modbus-adapter = { version = "0.9.0", package = "lissio-modbus-adapter", path = "crates/transport/modbus-adapter" }
s7-adapter = { version = "0.9.0", package = "lissio-s7-adapter", path = "crates/transport/s7-adapter" }
automotive = { version = "0.9.0", package = "lissio-automotive", path = "crates/transport/automotive" }
automotive-isotp = { version = "0.9.0", package = "lissio-automotive-isotp", path = "crates/transport/automotive_isotp" }
automotive-diag = { version = "0.9.0", package = "lissio-automotive-diag", path = "crates/transport/automotive_diag" }
# L1 node
graph = { version = "0.9.0", package = "lissio-graph", path = "crates/graph/graph" }
eval = { version = "0.9.0", package = "lissio-eval", path = "crates/graph/eval" }
frame-decoder = { version = "0.9.0", package = "lissio-frame-decoder", path = "crates/protocol/frame-decoder" }
hir = { version = "0.9.0", package = "lissio-hir", path = "crates/graph/hir" }
