async-trait = { workspace = true }
buffer_graph = { workspace = true }
bus = { workspace = true }
recording = { workspace = true }
can = { workspace = true }
chat = { workspace = true }
chat-session = { workspace = true }
data_model = { workspace = true }
pipeline = { workspace = true }
evaluator = { workspace = true }
error = { workspace = true }
graph_ops = { workspace = true }
keyring = { workspace = true }
llm = { workspace = true }
logic = { workspace = true }
mcp-client = { workspace = true }
mcp-server = { workspace = true }
petgraph = { workspace = true }
schema_types = { workspace = true }
stream = { workspace = true }
events = { workspace = true }
