[package]
name = "lissio"
version = "0.6.0"
description = "Modern serial port assistant with VOFA protocol support"
authors = ["peng"]
license = "GPL-2.0-only"
edition = "2021"

[package.metadata.lissio]
domain = "desktop"
layer = 5
responsibility = "Tauri IPC, platform adapters, dependency injection, and application composition"

[lib]
name = "lissio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["modbus-tcp", "modbus-rtu"]
modbus-tcp = ["dep:modbus-adapter"]
modbus-rtu = ["dep:modbus-adapter"]

[profile.release]
debug = true

[workspace]
# 领域与依赖规则见 docs/architecture/crates.md。目录按领域分组，层级由
# [package.metadata.lissio] 表达；允许直接依赖任意更低层，不使用转发 facade。
members = [
  # L0 foundation — 错误/类型/缓冲/DSP 原语/自包含基础设施，禁止依赖任何上层
  "crates/shared/error",
  "crates/shared/flow",
  "crates/protocol/points",
  "crates/vehicle/can",
  "crates/shared/data-model",
  "crates/protocol/logic",
  "crates/vehicle/diagnostic",
  "crates/protocol/schema_types",
  "crates/signal/raw-data",
  "crates/graph/buffer_graph",
  "crates/signal/waveform",
  "crates/signal/filter",
  "crates/signal/spectrum",
  "crates/signal/measurement",
  "crates/shared/subscription",
  "crates/signal/gpu",
  "crates/desktop/events",
  # L1 protocol — 协议解析/编码引擎
  "crates/protocol/protocol",
  "crates/protocol/protocol_float",
  "crates/protocol/protocol_can_bridge",
  "crates/protocol/logic_decoder",
  "crates/protocol/schema",
  # L1 transport — 通道收发（串口/网络/CAN 桥接/汽车诊断）
  "crates/transport/serial",
  "crates/transport/network",
  "crates/transport/can-transport",
  "crates/transport/transport",
  "crates/protocol/acquisition",
  "crates/transport/modbus-adapter",
  "crates/transport/automotive",
  "crates/transport/automotive_isotp",
  "crates/transport/automotive_diag",
  # L1 node — 节点图编译器与运行时（HIR→Plane→Lower→Eval）
  "crates/graph/kind",
  "crates/graph/hir",
  "crates/graph/plane",
  "crates/graph/lower",
  "crates/graph/eval",
  "crates/graph/graph",
  "crates/protocol/frame-decoder",
  "crates/graph/trigger",
  "crates/graph/graph-testkit",
  # L2 pipeline — 数据平面（字节路由/数值求值/流框架/调度）
  "crates/data/bus",
  "crates/data/recording",
  "crates/desktop/pipeline",
  "crates/desktop/stream",
  "crates/desktop/evaluator",
  # L3 app — 应用核心（全局状态/图提交核心/原生菜单/更新流）
  "crates/desktop/app",
  "crates/desktop/graph_ops",
  "crates/desktop/menu_shell",
  "crates/desktop/update_flow",
  # L3 ai — AI/MCP 基础设施
  "crates/ai/llm",
  "crates/ai/chat-session",
  "crates/ai/chat",
  "crates/ai/mcp-client",
  "crates/desktop/mcp-server",
  # L4 cmd — Tauri IPC 命令薄适配层，不承载核心逻辑；禁止被任何非 cmd crate 依赖
]

[workspace.package]
edition = "2021"
version = "0.6.0"
license = "GPL-2.0-only"

[workspace.lints.clippy]
# 最严格 clippy 配置 — 所有规则组 deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# 合理放宽的规则 (风格偏好或无法控制的外部因素)
# 允许模块名与类型名重复 (如 config::Config, transport::Transport)
module_name_repetitions = "allow"
# 不强制每个函数标 must_use (过于激进)
must_use_candidate = "allow"
# 不强制返回 Result/Option 的函数有文档 (本项目非 pub API 库)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 文档中标识符不强制加反引号
doc_markdown = "allow"
# 依赖版本冲突无法控制
multiple_crate_versions = "allow"
# 不要求 package 有完整 metadata (description/license 等)
cargo_common_metadata = "allow"
# 允许较多参数 (如配置初始化)
too_many_arguments = "allow"
# 允许 enum variant 名重复外层名
enum_glob_use = "allow"
# 允许使用 std::print (调试用)
print_stdout = "allow"
print_stderr = "allow"
# 允许大整数/浮点字面量不带下划线 (如波特率 115200)
unreadable_literal = "allow"
# 允许 match 同一变量
single_match_else = "allow"
# 允许 if-then-else 链 (比 match 更清晰时)
match_same_arms = "allow"
# 允许手动 clamp

manual_clamp = "allow"
# 允许结构体字段顺序不优化
struct_field_names = "allow"
# 允许较长的文档
doc_link_code = "allow"
# 允许 &Vec 参数 (与现有 API 兼容)
ptr_arg = "allow"
# 允许返回引用
needless_pass_by_value = "allow"
# 允许使用 format! 字符串
useless_format = "allow"
# 允许默认 trait 实现不显式
new_without_default = "allow"
# 允许较多方法 (impl 块)
too_many_lines = "allow"
# MutexGuard 临界区按锁序整段持有是数据平面的刻意并发语义, 按逐次使用拆小作用域
# 反而扩大竞态窗口 (clippy nursery 启发式)
significant_drop_tightening = "allow"
# Tauri 命令保持 async 以在 tokio 运行时执行 (sync 命令会跑在主线程, 持锁路径
# 会阻塞 UI); 大量命令无 await 点属正常形态
unused_async = "allow"



[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# genai: 多 LLM provider 聚合客户端 (OpenAI/Anthropic/Gemini/DeepSeek/通义/Kimi/GLM/
# Ollama 等 26+ 原生协议), 内部复用 reqwest+rustls, 流式与工具调用完备 —
# 避免 AI 对话层手写各家 provider 协议 (AI 功能统一规划在后端的基础设施)
genai = "0.6"
# rmcp: Model Context Protocol 官方 Rust SDK — MCP client (stdio/streamable-http)
# 与 server (streamable-http) 双向能力, MCP 协议不在本仓库自研
rmcp = { version = "3.1", default-features = false, features = [
  "macros",
  "server",
  "transport-streamable-http-server",
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# axum: 本地 MCP server 的 HTTP 宿主 (rmcp streamable-http server 传输为 tower service,
# 需要 HTTP 框架挂载), 仅监听 127.0.0.1
# keyring: 系统凭据库 (macOS Keychain / Windows Credential Manager / libsecret) —
# AI provider 的 API key 存钥匙串而非明文 settings.json; 自研加密落盘仍可被提取,
# 系统凭据库才是正确方案
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
security-framework = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures = "0.3"
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = { version = "5.4.4", default-features = false }
log = "0.4"
libc = "0.2"
thiserror = "1"
regex = "1"
glob = "0.3"
rustc-hash = "2"
criterion = { version = "0.7", features = ["html_reports"] }
parking_lot = "0.12"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
# wgpu: 跨平台 GPU compute (macOS=Metal / Windows=DX12+Vulkan / Linux=Vulkan) —
# 波形包络降采样 (gpu_core); pollster 供阻塞线程上同步初始化/映射
wgpu = "30"
pollster = "1"
# scirs2-core: SciRS2 科学计算核心 — 数值平面 Math 单元的 SIMD 批量求值
# (SimdUnifiedOps, wide 后端, AVX2/NEON 运行时分发); std 必须显式开启
# (0.6.5 打包缺陷: 关闭 default 后大量模块未按 no_std 门控)
scirs2-core = { version = "0.6.5", default-features = false, features = ["std", "simd"] }
# Tauri 桌面框架与官方插件 — 版本唯一登记点, 成员一律 `workspace = true` 继承;
# tauri features 取根与成员的历史并集 (features 在依赖图上做并集, 与原各处分散声明等价)
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
semver = "1"
# 硬件/平台访问
serialport = "4"
nusb = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry"] }
# FFT (dsp_fft)
rustfft = "6"
realfft = "3"
bytemuck = { version = "1", features = ["derive"] }
duckdb = { version = "1.5.5", features = ["bundled"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# ---- workspace 内部 crate (路径 = crates/<domain>/<crate>) ----
# L0 foundation
gpu = { path = "crates/signal/gpu" }
waveform = { path = "crates/signal/waveform" }
buffer_graph = { path = "crates/graph/buffer_graph" }
raw-data = { path = "crates/signal/raw-data" }
data_model = { package = "data-model", path = "crates/shared/data-model" }
error = { path = "crates/shared/error" }
flow = { path = "crates/shared/flow" }
points = { path = "crates/protocol/points" }
acquisition = { path = "crates/protocol/acquisition" }
can = { path = "crates/vehicle/can" }
logic = { path = "crates/protocol/logic" }
diagnostic = { path = "crates/vehicle/diagnostic" }
schema_types = { path = "crates/protocol/schema_types" }
events = { path = "crates/desktop/events" }
subscription = { path = "crates/shared/subscription" }
filter = { path = "crates/signal/filter" }
spectrum = { path = "crates/signal/spectrum" }
measurement = { path = "crates/signal/measurement" }
# L1 protocol
protocol = { path = "crates/protocol/protocol" }
protocol_float = { path = "crates/protocol/protocol_float" }
protocol_can_bridge = { path = "crates/protocol/protocol_can_bridge" }
logic_decoder = { path = "crates/protocol/logic_decoder" }
schema = { path = "crates/protocol/schema" }
# L1 transport
can_transport = { package = "can-transport", path = "crates/transport/can-transport" }
transport = { path = "crates/transport/transport" }
network = { path = "crates/transport/network" }
serial = { path = "crates/transport/serial" }
automotive_isotp = { path = "crates/transport/automotive_isotp" }
automotive_diag = { path = "crates/transport/automotive_diag" }
automotive = { path = "crates/transport/automotive" }
modbus-adapter = { path = "crates/transport/modbus-adapter" }
# L1 node
graph = { package = "graph", path = "crates/graph/graph" }
eval = { path = "crates/graph/eval" }
frame-decoder = { path = "crates/protocol/frame-decoder" }
hir = { path = "crates/graph/hir" }
kind = { path = "crates/graph/kind" }
lower = { path = "crates/graph/lower" }
plane = { path = "crates/graph/plane" }
graph_testkit = { package = "graph-testkit", path = "crates/graph/graph-testkit" }
trigger = { path = "crates/graph/trigger" }
# L2 pipeline
pipeline = { path = "crates/desktop/pipeline" }
bus = { path = "crates/data/bus" }
recording = { path = "crates/data/recording" }
evaluator = { path = "crates/desktop/evaluator" }
stream = { path = "crates/desktop/stream" }
# L3 app
app = { path = "crates/desktop/app" }
graph_ops = { path = "crates/desktop/graph_ops" }
menu_shell = { path = "crates/desktop/menu_shell" }
update_flow = { path = "crates/desktop/update_flow" }
# L3 ai
llm = { path = "crates/ai/llm" }
chat = { path = "crates/ai/chat" }
chat-session = { path = "crates/ai/chat-session" }
mcp-client = { path = "crates/ai/mcp-client" }
mcp-server = { path = "crates/desktop/mcp-server" }
# L4 cmd
libautomotive = "0.1"

[build-dependencies]
tauri-build = { workspace = true }

