[package]
name = "lissio"
version = "0.6.1"
description = "Modern serial port assistant with VOFA protocol support"
authors = ["peng"]
license = "GPL-2.0-only"
repository = "https://github.com/Horldsence/Lissio"
edition = "2024"

[package.metadata.lissio]
domain = "desktop"
layer = 5
responsibility = "Desktop platform shell, window/update integration, and supervised lissio-server sidecar lifecycle"

[lib]
name = "lissio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Pin the desktop binary to the product name; the implicit target would follow
# the package name if this section were ever removed.
[[bin]]
name = "lissio"
path = "src/main.rs"

[features]
default = []

[profile.release]
debug = true

[workspace]
# 领域与依赖规则见 docs/architecture/crates.md。目录按领域分组，层级由
# [package.metadata.lissio] 表达；允许直接依赖任意更低层，不使用转发 facade。
members = [
  # L0 foundation — 错误/类型/缓冲/DSP 原语/自包含基础设施，禁止依赖任何上层
  "crates/shared/error",
  "crates/shared/flow",
  "crates/protocol/points",
  "crates/vehicle/can",
  "crates/shared/data-model",
  "crates/protocol/logic",
  "crates/vehicle/diagnostic",
  "crates/protocol/schema_types",
  "crates/signal/raw-data",
  "crates/graph/buffer_graph",
  "crates/signal/waveform",
  "crates/signal/filter",
  "crates/signal/spectrum",
  "crates/signal/measurement",
  "crates/shared/subscription",
  "crates/signal/gpu",
  "crates/desktop/events",
  # L1 protocol — 协议解析/编码引擎
  "crates/protocol/protocol",
  "crates/protocol/protocol_float",
  "crates/protocol/protocol_can_bridge",
  "crates/protocol/logic_decoder",
  "crates/protocol/schema",
  # L1 transport — 通道收发（串口/网络/CAN 桥接/汽车诊断）
  "crates/transport/device-tree",
  "crates/transport/serial",
  "crates/transport/network",
  "crates/transport/can-transport",
  "crates/transport/transport",
  "crates/protocol/acquisition",
  "crates/transport/modbus-adapter",
  "crates/transport/s7-adapter",
  "crates/transport/automotive",
  "crates/transport/automotive_isotp",
  "crates/transport/automotive_diag",
  # L1 node — 节点图编译器与运行时（HIR→Plane→Lower→Eval）
  "crates/graph/kind",
  "crates/graph/hir",
  "crates/graph/plane",
  "crates/graph/lower",
  "crates/graph/eval",
  "crates/graph/graph",
  "crates/protocol/frame-decoder",
  "crates/graph/trigger",
  "crates/graph/graph-testkit",
  # L2 pipeline — 数据平面（字节路由/数值求值/流框架/调度）
  "crates/data/bus",
  "crates/data/recording",
  "crates/desktop/pipeline",
  "crates/desktop/stream",
  "crates/desktop/evaluator",
  # L3 app — 应用核心（全局状态/图提交核心/原生菜单/更新流）
  "crates/desktop/app",
  "crates/desktop/graph_ops",
  "crates/desktop/menu_shell",
  "crates/desktop/update_flow",
  # L3 ai — AI/MCP 基础设施
  "crates/ai/llm",
  "crates/ai/chat-session",
  "crates/ai/chat",
  "crates/ai/mcp-client",
  "crates/desktop/ai-host",
  "crates/desktop/control-api",
  "crates/desktop/rpc-api",
  "crates/desktop/backend-server",
  "crates/desktop/backend-host",
  "crates/desktop/mcp-server",
  "crates/desktop/backend-cli",
  # L4 cmd — Tauri IPC 命令薄适配层，不承载核心逻辑；禁止被任何非 cmd crate 依赖
]

[workspace.package]
edition = "2024"
repository = "https://github.com/Horldsence/Lissio"
version = "0.6.1"
license = "GPL-2.0-only"

[workspace.lints.clippy]
# 最严格 clippy 配置 — 所有规则组 deny
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# 合理放宽的规则 (风格偏好或无法控制的外部因素)
# 允许模块名与类型名重复 (如 config::Config, transport::Transport)
module_name_repetitions = "allow"
# 不强制每个函数标 must_use (过于激进)
must_use_candidate = "allow"
# 不强制返回 Result/Option 的函数有文档 (本项目非 pub API 库)
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 文档中标识符不强制加反引号
doc_markdown = "allow"
# 依赖版本冲突无法控制
multiple_crate_versions = "allow"
# 不要求 package 有完整 metadata (description/license 等)
cargo_common_metadata = "allow"
# 允许较多参数 (如配置初始化)
too_many_arguments = "allow"
# 允许 enum variant 名重复外层名
enum_glob_use = "allow"
# 允许使用 std::print (调试用)
print_stdout = "allow"
print_stderr = "allow"
# 允许大整数/浮点字面量不带下划线 (如波特率 115200)
unreadable_literal = "allow"
# 允许 match 同一变量
single_match_else = "allow"
# 允许 if-then-else 链 (比 match 更清晰时)
match_same_arms = "allow"
# 允许手动 clamp

manual_clamp = "allow"
# 允许结构体字段顺序不优化
struct_field_names = "allow"
# 允许较长的文档
doc_link_code = "allow"
# 允许 &Vec 参数 (与现有 API 兼容)
ptr_arg = "allow"
# 允许返回引用
needless_pass_by_value = "allow"
# 允许使用 format! 字符串
useless_format = "allow"
# 允许默认 trait 实现不显式
new_without_default = "allow"
# 允许较多方法 (impl 块)
too_many_lines = "allow"
# MutexGuard 临界区按锁序整段持有是数据平面的刻意并发语义, 按逐次使用拆小作用域
# 反而扩大竞态窗口 (clippy nursery 启发式)
significant_drop_tightening = "allow"
# Tauri 命令保持 async 以在 tokio 运行时执行 (sync 命令会跑在主线程, 持锁路径
# 会阻塞 UI); 大量命令无 await 点属正常形态
unused_async = "allow"
# 同上: Tauri 命令/AppState 方法保持 async 签名, 无 await 点属正常形态
# (新版 clippy 将 impl 块内该形态拆分为独立 lint)
unused_async_trait_impl = "allow"
# 测试断言 `assert!(x.is_empty())` 语义清晰且不要求集合实现 PartialEq,
# 改写为 assert_eq 需逐类型适配且对自定义集合不可行
assert_is_empty = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# schemars: 能力节点工具入参的 JSON Schema 单一来源 (与 rmcp 内嵌版本同大版本),
# MCP 工具路由与内置 AI 工具规格由同一 schema 派生
schemars = "1"
# ts-rs: 由 Rust wire 类型生成 TypeScript 声明 (显式导出程序, 不走测试自动写盘)。
# 仅用于构建期合同导出; 保留 serde-compat 的不兼容属性告警作为漂移检查的一部分。
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# genai: 多 LLM provider 聚合客户端 (OpenAI/Anthropic/Gemini/DeepSeek/通义/Kimi/GLM/
# Ollama 等 26+ 原生协议), 内部复用 reqwest+rustls, 流式与工具调用完备 —
# 避免 AI 对话层手写各家 provider 协议 (AI 功能统一规划在后端的基础设施)
genai = "0.6"
# rmcp: Model Context Protocol 官方 Rust SDK — MCP client (stdio/streamable-http)
# 与 server (streamable-http) 双向能力, MCP 协议不在本仓库自研
rmcp = { version = "3.1", default-features = false, features = [
  "macros",
  "server",
  "transport-streamable-http-server",
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
# axum: 本地 MCP server 的 HTTP 宿主 (rmcp streamable-http server 传输为 tower service,
# 需要 HTTP 框架挂载), 仅监听 127.0.0.1
# keyring: 系统凭据库 (macOS Keychain / Windows Credential Manager / libsecret) —
# AI provider 的 API key 存钥匙串而非明文 settings.json; 自研加密落盘仍可被提取,
# 系统凭据库才是正确方案
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
security-framework = "3"
# axum: Web 出口 (backend-server) 的 HTTP-RPC + WebSocket 宿主, 以及 MCP server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
# tower-http: Web 出口的 CORS 白名单 / 请求体上限 / 静态站点托管
tower-http = { version = "0.6", default-features = false, features = ["cors", "limit", "fs", "trace"] }
futures = "0.3"
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "fs", "signal"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = { version = "5.4.4", default-features = false }
# tokio-s7: 西门子 S7comm 异步客户端 (ISO-on-TCP), PLC 采集的第二条点位源 (Apache-2.0)
tokio-s7 = "0.1.7"
log = "0.4"
# clap: backend-cli 子命令解析 (derive); env_logger: 无界面宿主的 stderr 日志
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
libc = "0.2"
thiserror = "1"
regex = "1"
glob = "0.3"
rustc-hash = "2"
criterion = { version = "0.7", features = ["html_reports"] }
parking_lot = "0.12"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
# wgpu: 跨平台 GPU compute (macOS=Metal / Windows=DX12+Vulkan / Linux=Vulkan) —
# 波形包络降采样 (gpu_core); pollster 供阻塞线程上同步初始化/映射
wgpu = "30"
pollster = "1"
# scirs2-core: SciRS2 科学计算核心 — 数值平面 Math 单元的 SIMD 批量求值
# (SimdUnifiedOps, wide 后端, AVX2/NEON 运行时分发); std 必须显式开启
# (0.6.5 打包缺陷: 关闭 default 后大量模块未按 no_std 门控)
scirs2-core = { version = "0.6.5", default-features = false, features = ["std", "simd"] }
# Tauri 桌面框架与官方插件 — 版本唯一登记点, 成员一律 `workspace = true` 继承;
# tauri features 取根与成员的历史并集 (features 在依赖图上做并集, 与原各处分散声明等价)
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
getrandom = "0.3"
# 硬件/平台访问
serialport = "4"
core-foundation = "0.10"
io-kit-sys = "0.4"
nusb = "0.2"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry"] }
# FFT (dsp_fft)
rustfft = "6"
realfft = "3"
bytemuck = { version = "1", features = ["derive"] }
duckdb = { version = "1.5.5", features = ["bundled", "parquet"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# ---- workspace 内部 crate (路径 = crates/<domain>/<crate>) ----
# L0 foundation
gpu = { version = "0.6.1", package = "lissio-gpu", path = "crates/signal/gpu" }
waveform = { version = "0.6.1", package = "lissio-waveform", path = "crates/signal/waveform" }
buffer_graph = { version = "0.6.1", package = "lissio-buffer-graph", path = "crates/graph/buffer_graph" }
raw-data = { version = "0.6.1", package = "lissio-raw-data", path = "crates/signal/raw-data" }
data_model = { version = "0.6.1", package = "lissio-data-model", path = "crates/shared/data-model" }
error = { version = "0.6.1", package = "lissio-error", path = "crates/shared/error" }
flow = { version = "0.6.1", package = "lissio-flow", path = "crates/shared/flow" }
points = { version = "0.6.1", package = "lissio-points", path = "crates/protocol/points" }
acquisition = { version = "0.6.1", package = "lissio-acquisition", path = "crates/protocol/acquisition" }
can = { version = "0.6.1", package = "lissio-can", path = "crates/vehicle/can" }
logic = { version = "0.6.1", package = "lissio-logic", path = "crates/protocol/logic" }
diagnostic = { version = "0.6.1", package = "lissio-diagnostic", path = "crates/vehicle/diagnostic" }
schema_types = { version = "0.6.1", package = "lissio-schema-types", path = "crates/protocol/schema_types" }
events = { version = "0.6.1", package = "lissio-events", path = "crates/desktop/events" }
subscription = { version = "0.6.1", package = "lissio-subscription", path = "crates/shared/subscription" }
filter = { version = "0.6.1", package = "lissio-filter", path = "crates/signal/filter" }
spectrum = { version = "0.6.1", package = "lissio-spectrum", path = "crates/signal/spectrum" }
measurement = { version = "0.6.1", package = "lissio-measurement", path = "crates/signal/measurement" }
# L1 protocol
protocol = { version = "0.6.1", package = "lissio-protocol", path = "crates/protocol/protocol" }
protocol_float = { version = "0.6.1", package = "lissio-protocol-float", path = "crates/protocol/protocol_float" }
protocol_can_bridge = { version = "0.6.1", package = "lissio-protocol-can-bridge", path = "crates/protocol/protocol_can_bridge" }
logic_decoder = { version = "0.6.1", package = "lissio-logic-decoder", path = "crates/protocol/logic_decoder" }
schema = { version = "0.6.1", package = "lissio-schema", path = "crates/protocol/schema" }
# L1 transport
device_tree = { version = "0.6.1", package = "lissio-device-tree", path = "crates/transport/device-tree" }
can_transport = { version = "0.6.1", package = "lissio-can-transport", path = "crates/transport/can-transport" }
transport = { version = "0.6.1", package = "lissio-transport", path = "crates/transport/transport" }
network = { version = "0.6.1", package = "lissio-network", path = "crates/transport/network" }
serial = { version = "0.6.1", package = "lissio-serial", path = "crates/transport/serial" }
modbus-adapter = { version = "0.6.1", package = "lissio-modbus-adapter", path = "crates/transport/modbus-adapter" }
s7-adapter = { version = "0.6.1", package = "lissio-s7-adapter", path = "crates/transport/s7-adapter" }
automotive = { version = "0.6.1", package = "lissio-automotive", path = "crates/transport/automotive" }
automotive-isotp = { version = "0.6.1", package = "lissio-automotive-isotp", path = "crates/transport/automotive_isotp" }
automotive-diag = { version = "0.6.1", package = "lissio-automotive-diag", path = "crates/transport/automotive_diag" }
# L1 node
graph = { version = "0.6.1", package = "lissio-graph", path = "crates/graph/graph" }
eval = { version = "0.6.1", package = "lissio-eval", path = "crates/graph/eval" }
frame-decoder = { version = "0.6.1", package = "lissio-frame-decoder", path = "crates/protocol/frame-decoder" }
hir = { version = "0.6.1", package = "lissio-hir", path = "crates/graph/hir" }
kind = { version = "0.6.1", package = "lissio-kind", path = "crates/graph/kind" }
lower = { version = "0.6.1", package = "lissio-lower", path = "crates/graph/lower" }
plane = { version = "0.6.1", package = "lissio-plane", path = "crates/graph/plane" }
graph_testkit = { version = "0.6.1", package = "lissio-graph-testkit", path = "crates/graph/graph-testkit" }
trigger = { version = "0.6.1", package = "lissio-trigger", path = "crates/graph/trigger" }
# L2 pipeline
pipeline = { version = "0.6.1", package = "lissio-pipeline", path = "crates/desktop/pipeline" }
bus = { version = "0.6.1", package = "lissio-bus", path = "crates/data/bus" }
recording = { version = "0.6.1", package = "lissio-recording", path = "crates/data/recording" }
evaluator = { version = "0.6.1", package = "lissio-evaluator", path = "crates/desktop/evaluator" }
stream = { version = "0.6.1", package = "lissio-stream", path = "crates/desktop/stream" }
# L3 app
app = { version = "0.6.1", package = "lissio-app", path = "crates/desktop/app" }
graph_ops = { version = "0.6.1", package = "lissio-graph-ops", path = "crates/desktop/graph_ops" }
menu_shell = { version = "0.6.1", package = "lissio-menu-shell", path = "crates/desktop/menu_shell" }
update_flow = { version = "0.6.1", package = "lissio-update-flow", path = "crates/desktop/update_flow" }
# L3 ai
llm = { version = "0.6.1", package = "lissio-llm", path = "crates/ai/llm" }
chat = { version = "0.6.1", package = "lissio-chat", path = "crates/ai/chat" }
chat-session = { version = "0.6.1", package = "lissio-chat-session", path = "crates/ai/chat-session" }
mcp-client = { version = "0.6.1", package = "lissio-mcp-client", path = "crates/ai/mcp-client" }
ai-host = { version = "0.6.1", package = "lissio-ai-host", path = "crates/desktop/ai-host" }
mcp-server = { version = "0.6.1", package = "lissio-mcp-server", path = "crates/desktop/mcp-server" }
control-api = { version = "0.6.1", package = "lissio-control-api", path = "crates/desktop/control-api" }
rpc-api = { version = "0.6.1", package = "lissio-rpc-api", path = "crates/desktop/rpc-api" }
backend-server = { version = "0.6.1", package = "lissio-backend-server", path = "crates/desktop/backend-server" }
backend-host = { version = "0.6.1", package = "lissio-backend-host", path = "crates/desktop/backend-host" }
# backend-cli 是叶子 bin (无消费方), 仅经 [workspace].members 纳入构建
# L4 cmd
libautomotive = "0.1"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
menu_shell = { workspace = true }
update_flow = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-process = { workspace = true }
getrandom = { workspace = true }
window-vibrancy = { workspace = true }

[dev-dependencies]
app = { workspace = true }
backend-host = { workspace = true }
buffer_graph = { workspace = true }
data_model = { workspace = true }
error = { workspace = true }
graph_ops = { workspace = true }
graph_testkit = { workspace = true }
device_tree = { workspace = true }
kind = { workspace = true }
schema_types = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# tauri-plugin-updater 仅桌面端支持, target 门控声明 (不在上方通用段重复登记)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { workspace = true }

[lints]
workspace = true
