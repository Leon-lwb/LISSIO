[package]
name = "lissio-control-api"
description = "Lissio 后端控制能力核心 — 设备发送/数据读取/节点图编辑/端点开闭/运行控制/录制/波形快照的工具实现与状态切片, 以及软件能力节点注册表 (MCP/CLI/内置 AI 共用, 无 Tauri/rmcp)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "control_api"

[lints]
workspace = true

[dependencies]
kind = { workspace = true }
acquisition = { workspace = true }
points = { workspace = true }
# graph_hir 测试构造 Protocol 节点需要 ProtocolConfig
schema_types = { workspace = true }
pipeline = { workspace = true }
app = { workspace = true }
graph_ops = { workspace = true }
buffer_graph = { workspace = true }
raw-data = { workspace = true }
can = { workspace = true }
logic = { workspace = true }
recording = { workspace = true }
waveform = { workspace = true }
data_model = { workspace = true }
events = { workspace = true }
# panel_data 复用推送侧的面板解析失败词表 (ConfigError::PanelRequestUnresolved)
error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
# graph_hir 投影: 直接遍历 TypedGraph (CompiledGraph.hir 的 petgraph 图)
petgraph = { workspace = true }

[dev-dependencies]
# graph_hir 测试构造 Transport 节点 (dev-only, 架构门禁要求非生产依赖)
graph_testkit = { workspace = true }

# CAN 导出时间戳在 Windows 上没有 localtime_r, 改用 Win32 时区 API 求本地时间
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[package.metadata.lissio]
domain = "desktop"
layer = 3
responsibility = "后端控制能力核心 — 工具实现与状态切片 + 软件能力节点注册表 (工具/技能文档单一事实来源, MCP 工具路由与内置 AI 工具规格运行期派生; 无 Tauri/rmcp)"
