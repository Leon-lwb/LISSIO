[package]
name = "lissio-backend-host"
description = "Lissio 独立后端装配与生命周期 — AI、传输适配器、点位投影、工作区恢复与收尾"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "backend_host"

[lints]
workspace = true

[features]
default = ["modbus-tcp", "modbus-rtu", "s7"]
modbus-tcp = ["dep:modbus-adapter"]
modbus-rtu = ["dep:modbus-adapter"]
s7 = ["dep:s7-adapter"]

[dependencies]
serde_json = { workspace = true }
llm = { workspace = true }
ai-host = { workspace = true }
app = { workspace = true }
acquisition = { workspace = true }
pipeline = { workspace = true }
performance = { workspace = true }
points = { workspace = true }
transport = { workspace = true }
serial = { workspace = true }
gpu = { workspace = true }
network = { workspace = true }
can_transport = { workspace = true }
automotive = { workspace = true }
automotive-isotp = { workspace = true }
automotive-diag = { workspace = true }
data_model = { workspace = true }
device_tree = { workspace = true }
control-api = { workspace = true }
events = { workspace = true }
graph_ops = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
modbus-adapter = { workspace = true, optional = true }
s7-adapter = { workspace = true, optional = true }

[package.metadata.lissio]
domain = "desktop"
layer = 4
responsibility = "独立后端装配与生命周期 — AI 宿主、采集适配器、点位投影、配置目录、工作区恢复与收尾"
