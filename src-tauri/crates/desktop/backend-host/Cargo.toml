[package]
name = "backend-host"
description = "Lissio 无界面后端装配与生命周期 — 传输适配器注册、点位投影、工作区恢复与收尾 (Tauri 组合根与 CLI 共用, 无 Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["modbus-tcp", "modbus-rtu", "s7"]
modbus-tcp = ["dep:modbus-adapter"]
modbus-rtu = ["dep:modbus-adapter"]
s7 = ["dep:s7-adapter"]

[dependencies]
app = { workspace = true }
acquisition = { workspace = true }
pipeline = { workspace = true }
points = { workspace = true }
transport = { workspace = true }
serial = { workspace = true }
gpu = { workspace = true }
network = { workspace = true }
can_transport = { workspace = true }
data_model = { workspace = true }
control-api = { workspace = true }
events = { workspace = true }
graph_ops = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
modbus-adapter = { workspace = true, optional = true }
s7-adapter = { workspace = true, optional = true }

[package.metadata.lissio]
domain = "desktop"
layer = 4
responsibility = "无界面后端装配与生命周期 — 采集适配器注册、点位投影、配置目录解析、工作区恢复与收尾 (GUI 与单后端共用)"
