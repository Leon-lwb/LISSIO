[package]
name = "lissio-backend-server"
description = "Lissio Web 出口组合根 — HTTP-RPC 与 WebSocket 推送, 复用 backend-host 装配与 rpc-api 派发表"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "backend_server"

[lints]
workspace = true

[[bin]]
name = "lissio-server"
path = "src/main.rs"

[dependencies]
stream = { workspace = true }
ai-host = { workspace = true }
app = { workspace = true }
backend-host = { workspace = true }
control-api = { workspace = true }
data_model = { workspace = true }
events = { workspace = true }
mcp-server = { workspace = true }
performance = { workspace = true }
rpc-api = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
chat = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
# 帧类型 (src/frames.rs) 与 examples/export_frames.rs 的 TypeScript 契约导出。
# 前端投影由本出口自己拥有: rpc-api (L4) 不得反向 dev-depend 本 crate (L5)。
ts-rs = { workspace = true }

[package.metadata.lissio]
domain = "desktop"
layer = 5
responsibility = "Web 出口组合根 — axum HTTP-RPC / WebSocket 推送 / 令牌鉴权 / 静态站点托管; 能力与装配全部复用 control-api 与 backend-host"
