# 节点错误首次引导 (每种错误类型仅显示一次, 由 errorGuidance.ts 管理)
errorGuidePrefix: 提示
errorGuideTransport: 传输层打开失败, 请检查线缆连接与驱动, 然后刷新端口列表重试
errorGuideProtocol: 协议引擎创建失败, 请检查协议配置与通道数是否正确
errorGuidePortNotFound: 未找到该端口, 请确认设备已连接, 并点击刷新更新端口列表
errorGuidePortAlreadyOpen: 该端口已被占用, 请关闭其他占用此端口的程序 (如串口助手) 后重试
errorGuidePortNotOpen: 端口尚未打开，请先连接该设备节点再执行操作
errorGuideIo: 系统 IO 错误, 请检查设备连接是否稳定, 以及当前用户是否有端口访问权限
errorGuideConfig: 节点配置有误, 请检查节点参数 (端口/波特率/协议等) 是否完整合法
errorGuideSerde: 数据序列化失败, 请检查发送内容或配置格式是否正确

