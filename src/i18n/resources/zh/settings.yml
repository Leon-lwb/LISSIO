templateTextProtocolDesc: ASCII 文本 (FireWater) 解析 + 协议转换到数值 (JustFloat)，数字显示与波形直接可读
templateDemo: 综合演示
templateDemoDesc: 滤波 + 数学 + 波形 / 仪表的完整流水线示例
templateApplyTitle: 应用模板
