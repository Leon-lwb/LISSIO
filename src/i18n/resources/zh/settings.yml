settingRecEnabled: 启用录制数据库
settingRecEnabledDesc: 关闭后完全不再打开或写入 DuckDB，采集与运行控制不受影响；可随时热更新，已有录制文件与历史一律保留
recordingDisabledNotice: 录制数据库已在设置中关闭：不写入新数据，关闭期间也不读取历史（文件与历史都已保留），重新开启后即可继续查看。
recordingDisabledShort: 录制数据库已关闭，不会写入新数据。
recordingDisabledOpenSettings: 去设置
settingRecDatabaseDir: 录制数据库目录
settingRecDatabaseDirDesc: 采集数据 DuckDB 的保存目录（空 = 默认位置）；运行中修改在暂停或下次启动时生效，旧文件保留
settingRecDefaultDir: 默认位置
settingRecBrowse: 浏览
settingRecContinueEmpty: 启动续写空会话
settingRecContinueEmptyDesc: 上次会话没有写入任何数据时继续写同一会话，避免空会话堆积（含崩溃遗留）
settingRecCleanupFailed: 启动清理失败会话
settingRecCleanupFailedDesc: 每次启动自动删除 failed 状态的会话（崩溃遗留，含其中有数据的）
settingRecCleanupStopped: 启动清理已停止会话
settingRecCleanupStoppedDesc: 每次启动自动删除 stopped 状态的会话（连带删除其已录数据，谨慎开启）
settingRecCleanupOlderDays: 启动清理过期会话（天）
settingRecCleanupOlderDaysDesc: 每次启动删除结束时间早于 N 天的会话（0 = 关闭）
settingRecCleanupKeepLatest: 启动保留最近会话数
settingRecCleanupKeepLatestDesc: 每次启动只保留最近 N 个会话，其余删除（0 = 关闭；当前活跃会话始终保留）
