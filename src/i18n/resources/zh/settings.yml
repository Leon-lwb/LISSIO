settingActivityBarVisible: 显示活动栏
settingActivityBarVisibleDesc: 在窗口左侧显示活动栏
settingAcrylicBackground: 亚克力背景
settingAcrylicBackgroundDesc: 使用系统毛玻璃效果作为窗口背景，面板将变为半透明
settingAcrylicOpacity: 毛玻璃透明度
settingAcrylicOpacityDesc: 拖动滑块或输入数值调整面板透明度，越小越透明（0.6 为默认观感）
settingFloatingGlass: 二级卡片磨砂
settingFloatingGlassDesc: 设置界面和各面板打开的二级卡片使用磨砂效果；与亚克力背景相互独立
settingFloatingGlassOpacity: 二级卡片透明度
settingFloatingGlassOpacityDesc: 调整二级卡片的透明度，越小越透明（0.72 为默认观感）
settingLiquidGlass: 液态玻璃
settingLiquidGlassDesc: 用 WebGPU/WebGL 渲染折射玻璃。关闭时保持高斯模糊观感；无可用图形后端时自动回落
settingLiquidGlassPreset: 液态玻璃预设
settingLiquidGlassPresetDesc: 选择折射的观感，从薄玻璃片到厚透镜
settingLiquidGlassIntensity: 液态玻璃强度
settingLiquidGlassIntensityDesc: 统一缩放折射与边缘弯折，越小越克制（0.7 为默认观感）
settingWindowOpacity: 整窗透明度
settingWindowOpacityDesc: 调节整个窗口的透明度，越小越透明；与亚克力背景相互独立
settingMotionSpeed: 动画速度
settingMotionSpeedDesc: 调整界面过渡的整体节奏；减少动画效果开启时始终立即完成
settingReducedMotion: 减少动画效果
settingReducedMotionDesc: 禁用界面中的动画和过渡效果，提升性能

# 设置项 - Editor
settingWaveformFps: 波形刷新率
settingWaveformFpsDesc: 波形图刷新频率 (FPS)
settingScopeDefaultTimeBase: 默认时基
settingScopeDefaultTimeBaseDesc: 新建波形图的默认水平时基
settingScopeDefaultVPerDiv: 默认垂直档位
settingScopeDefaultVPerDivDesc: 新建波形图的默认垂直档位
settingGridVisible: 默认显示网格
settingGridVisibleDesc: 新建波形图是否默认显示网格
settingCursorReadoutVisible: 显示光标读数
settingCursorReadoutVisibleDesc: 波形图鼠标跟随时是否显示数值读数悬浮框
settingCursorSnap: 光标吸附
settingCursorSnapDesc: Y 轴吸附到曲线在鼠标 X 处的插值 (X 轴仍跟随鼠标, 非吸附到采样点); 按住 Ctrl/Cmd 临时关闭吸附
settingCrosshairVisible: 显示十字线
settingCrosshairVisibleDesc: 显示鼠标跟随的横竖十字辅助线
settingHoverPointsVisible: 显示悬停采样点
settingHoverPointsVisibleDesc: 显示鼠标悬停时曲线上最近采样点的标记 (光标吸附开启时自动隐藏)
settingPauseOnInteract: 交互时自动暂停
settingPauseOnInteractDesc: 缩放或拖动波形时自动暂停实时刷新; 关闭后交互不打断刷新, 运行中也可水平拖动回看历史 (拖回最右端恢复实时跟随)

# 设置项 - Data Cache
settingWaveformBufferPoints: 波形缓存点数
settingWaveformBufferPointsDesc: 每个通道可保留的最大波形点数；历史时长约为点数 ÷ 采样率，高采样率下可适当调大
settingRawDataBufferBytes: 原始数据缓存字节数
settingRawDataBufferBytesDesc: 原始数据视图可保留的最大字节数
settingCanBufferFrames: CAN 帧缓存帧数
settingCanBufferFramesDesc: CAN 视图可保留的最大帧数
settingLogicBufferSamples: 逻辑采样缓存采样数
settingLogicBufferSamplesDesc: 逻辑分析仪可保留的最大采样数

# 设置项 - Serial
settingDefaultBaudRate: 默认波特率
settingDefaultBaudRateDesc: 新建串口连接的默认波特率
settingDefaultDataBits: 默认数据位
settingDefaultDataBitsDesc: 新建串口连接的默认数据位
settingDefaultParity: 默认校验
settingDefaultParityDesc: 新建串口连接的默认校验方式
settingDefaultStopBits: 默认停止位
settingDefaultStopBitsDesc: 新建串口连接的默认停止位
settingDefaultFlowControl: 默认流控
settingDefaultFlowControlDesc: 新建串口连接的默认流控方式

# 设置项 - Notifications
settingNotifEnabled: 启用通知
settingNotifEnabledDesc: 是否显示桌面通知
settingNotifDuration: 通知持续时长
settingNotifDurationDesc: 通知显示时长 (毫秒, 0=持久)
settingNotifShowOnConnect: 连接成功通知
settingNotifShowOnConnectDesc: 传输连接成功时显示通知
settingNotifShowOnDisconnect: 断开连接通知
settingNotifShowOnDisconnectDesc: 传输断开时显示通知
settingNotifShowOnError: 错误通知
settingNotifShowOnErrorDesc: 发生错误时显示通知

# 设置项 - Performance
settingMaxFeedWorkers: 自动并发 Worker 上限
settingMaxFeedWorkersDesc: 后端根据积压自动扩缩容，实际 worker 数不超过 CPU 数和此安全上限
settingEvalWorkers: 图评估并发数
settingEvalWorkersDesc: 数值平面按图内独立路径并行评估，1 为串行；多路径大流量时调大可加速
settingCoalesceMaxBytesKb: 数据管道内存预算 (MB)
settingCoalesceMaxBytesKbDesc: 所有后端 Topic 历史和排队数据使用的安全内存上限
settingMaxStreamShards: 预览帧率上限
settingMaxStreamShardsDesc: 前端预览最大刷新率；不会降低后端采集和解析速度
settingParseChannelCap: 预览带宽上限 (MB/s)
settingParseChannelCapDesc: IPC 预览的安全带宽上限；过载时只跳过旧预览批次

