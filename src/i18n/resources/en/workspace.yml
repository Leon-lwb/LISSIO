# First-error guidance for node errors (shown once per error kind, managed by errorGuidance.ts)
errorGuidePrefix: Tip
errorGuideTransport: Transport failed to open. Check the cable connection and drivers, then refresh the port list and retry
errorGuideProtocol: Protocol engine failed to start. Check the protocol configuration and channel count
errorGuidePortNotFound: Port not found. Make sure the device is connected, then refresh the port list
errorGuidePortAlreadyOpen: The port is already in use. Close other programs using this port (e.g. serial tools) and retry
errorGuidePortNotOpen: The port is not open yet. Connect the Transport node first
errorGuideIo: System IO error. Check the device connection and your permission to access the port
errorGuideConfig: Invalid node configuration. Check the node parameters (port / baud rate / protocol, etc.)
errorGuideSerde: Data serialization failed. Check the payload or configuration format

