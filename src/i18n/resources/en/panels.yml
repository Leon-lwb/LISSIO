# Data loss warnings (status bar + popover) — preview drops (rawdata) vs real loss (pipeline)
statusDropped: Data loss detected, click for details
notifDataDroppedTitle: Data loss detected
notifDataDroppedBody: "Lost {{count}} messages in the latest window (these bytes never reached the parser; the waveform has gaps). Try: lowering the source rate; increasing parallel worker limit and buffers in Settings → Performance; disabling unused raw data subscriptions"
droppedInfoTitle: Data loss explained
droppedInfoTitleRawdata: Preview drop explained
droppedInfoWhatRawdata: What is this — An overflow counter of the raw data preview. These bytes were parsed normally and reached the waveform; the preview just did not retain all of them for display. This is not data loss — parsing and waveforms are unaffected.
droppedInfoWhatPipeline: What is this — Real data loss. When incoming data exceeds the parse pipeline's capacity, some messages are skipped before parsing (broadcast Lagged), leaving gaps in waveforms and parse results.
droppedInfoWhy: "Why it happens — The source rate is too high, or parsing/rendering cannot keep up. The pipeline uses bounded buffers; when full, excess messages are dropped instead of blocking the stream. Note: the raw data preview drop counter (yellow) does not indicate data loss."
droppedInfoHowRawdata: What to do — Lower the source rate, or increase the raw data buffer capacity in Settings → Data Cache.
droppedInfoHowPipeline: What to do — Lower the source rate; increase the parallel worker limit and buffer capacities in Settings → Performance; or disable unused raw data subscriptions.
droppedInfoOpenSettings: Open Settings
